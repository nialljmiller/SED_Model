[build-system]
requires = ["setuptools>=68", "wheel", "numpy", "meson", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "sed-model"
version = "0.1.1"
description = "Forward and inverse stellar photometry from SED grids."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Niall Miller", email = "niall.j.miller@gmail.com" },
]
keywords = [
    "astronomy",
    "astrophysics",
    "stellar astronomy",
    "synthetic photometry",
    "spectral energy distributions",
    "sed",
    "stellar parameters",
    "bayesian inference",
    "mcmc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "emcee>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
demo = [
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/nialljmiller/SED_Model"
Repository = "https://github.com/nialljmiller/SED_Model"
Issues = "https://github.com/nialljmiller/SED_Model/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sed_model*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
