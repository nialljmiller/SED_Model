[build-system]
requires = ["meson-python>=0.16", "numpy>=2.0"]
build-backend = "mesonpy"

[project]
name = "sed-model"
dynamic = ["version"]
description = "Forward and inverse stellar photometry from SED grids."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Niall Miller", email = "niall.j.miller@gmail.com" },
]
keywords = [
    "astronomy",
    "astrophysics",
    "stellar astronomy",
    "synthetic photometry",
    "spectral energy distributions",
    "sed",
    "stellar parameters",
    "bayesian inference",
    "mcmc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=1.5",
    "emcee>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
demo = [
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/nialljmiller/SED_Model"
Repository = "https://github.com/nialljmiller/SED_Model"
Issues = "https://github.com/nialljmiller/SED_Model/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# musllinux and 32-bit have no gfortran in the build images we use
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest", "pandas", "emcee"]
# Import the installed wheel (not the source tree) and run the data-free kernel tests
test-command = "python -c \"import sed_model, sed_model.cc_api\" && pytest {project}/tests/test_kernels.py -p no:cacheprovider"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "yum install -y --disablerepo=epel gcc-gfortran || (sleep 30 && yum install -y --disablerepo=epel gcc-gfortran)"
